name: Deploy to ECS

on:
  push:
    branches: [ "aws" ]

env:
  AWS_REGION: us-east-1
  ECR_REPO: 490196132533.dkr.ecr.us-east-1.amazonaws.com/weather-fe
  CLUSTER_NAME: weather-cluster
  SERVICE_NAME: weather-fe-service

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: build-${{ github.run_number }}
        run: |
          docker build -t $ECR_REGISTRY/weather-fe:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/weather-fe:$IMAGE_TAG $ECR_REGISTRY/weather-fe:latest
          docker push $ECR_REGISTRY/weather-fe:$IMAGE_TAG
          docker push $ECR_REGISTRY/weather-fe:latest

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster $CLUSTER_NAME \
            --service $SERVICE_NAME \
            --force-new-deployment \
            --region $AWS_REGION
